version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: thesis_postgres
    environment:
      POSTGRES_DB: thesis_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/glosy_structure.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d thesis_db"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Node.js Backend
  backend:
    build: ./backend
    container_name: thesis_backend
    environment:
      PORT: 3500
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thesis_db
      DB_USER: root
      DB_PASSWORD: 1234
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      ACCESS_TOKEN_SECRET: 
      REFRESH_TOKEN_SECRET: 
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      GOOGLE_CLIENT_ID: 
      GOOGLE_CLIENT_ID_ANDROID: 
      GOOGLE_CLIENT_ID_IOS: 
      ENERGY_REGEN_INTERVAL: 3600000
      MAX_ENERGY: 5
    ports:
      - "3500:3500"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Python FastAPI Reels Service
  reels-service:
    build: ./reels-service
    container_name: thesis_reels_service
    environment:
      PORT: 3600
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thesis_db
      DB_USER: root
      DB_PASSWORD: 1234
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
    ports:
      - "3600:3600"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reels-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 3600 --reload

volumes:
  postgres_data:
